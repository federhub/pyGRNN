[build-system]
# setuptools>=77.0.3 is required for the bare SPDX `license = "MIT"` string below;
# older setuptools reads it as a {text/file} table and crashes with a TypeError.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGRNN"
version = "0.2.0"
description = "Python implementation of General Regression Neural Network (Nadaraya-Watson Estimator). A Feature Selection module based on GRNN is also provided"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Federico Amato", email = "federico.amato@unil.ch" },
]
requires-python = ">=3.10"
keywords = [
    "Machine Learning",
    "General Regression Neural Network",
    "Kernel Regression",
    "Feature Selection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "seaborn",
]

[project.urls]
Homepage = "https://github.com/federhub/pyGRNN"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pyGRNN"]
